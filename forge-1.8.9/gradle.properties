loom.platform=forge
org.gradle.jvmargs=-Xmx2g
# The mod is compiled with a JDK 8 that Gradle downloads: an installed Java 8 is often a JRE,
# which can't compile
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=true
# The version is the releases' one (mod.version of ../stonecutter.properties.toml), see build.gradle.kts
mcVersion=1.8.9
modid=mistlyclient
