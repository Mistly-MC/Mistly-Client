# Publishing a release builds the mod for every Minecraft version and attaches the jars to it,
# with misty-client.json: the list of jars and the Minecraft versions each one runs on. The
# Mistly launcher reads that list from the latest release and downloads the jar it needs.
# The Forge jars (1.8.9, 1.12.2) are attached too, listed apart in the "forge" key of that file
# (the launcher only installs the Fabric jars of its "jars" key).
name: Release jars

on:
  release:
    types: [published]
  # to rebuild the jars of an existing release
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release
        required: true

permissions:
  contents: write

jobs:
  jars:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Build every version
        run: |
          chmod +x gradlew
          ./gradlew build
      # Forge 1.8.9 and 1.12.2 (forge-1.8.9/, forge-1.12.2/): each its own Gradle, which runs on
      # Java 21 and downloads the JDK 8 the mod is compiled with
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build Forge 1.8.9
        working-directory: forge-1.8.9
        run: |
          chmod +x gradlew
          ./gradlew build
      - name: Build Forge 1.12.2
        working-directory: forge-1.12.2
        run: |
          chmod +x gradlew
          ./gradlew build
      - name: List the jars
        run: python3 .github/scripts/manifest.py build/release
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" build/release/* --clobber
