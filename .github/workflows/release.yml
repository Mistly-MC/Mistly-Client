# Publishing a release builds the mod for every Minecraft version and attaches the jars to it,
# with misty-client.json: the list of jars and the Minecraft versions each one runs on. The
# Mistly launcher reads that list from the latest release and downloads the jar it needs.
name: Release jars

on:
  release:
    types: [published]
  # to rebuild the jars of an existing release
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release
        required: true

permissions:
  contents: write

jobs:
  jars:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Build every version
        run: |
          chmod +x gradlew
          ./gradlew build
      - name: List the jars
        run: python3 .github/scripts/manifest.py build/release
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" build/release/* --clobber
